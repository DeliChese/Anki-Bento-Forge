name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-dev.txt

      - name: Scan tracked source for credential-shaped values
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' -- ':!tests'; then
            echo "Credential-shaped value detected in tracked source."
            exit 1
          fi

      - name: Critical lint
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Run isolated tests twice
        shell: pwsh
        run: ./scripts/test_isolated.ps1 -Python python

      - name: Compile check (syntax)
        run: python -m py_compile $(git ls-files '*.py')

      - name: Package and clean-profile install smoke
        if: matrix.python-version == '3.11'
        run: |
          pwsh -File scripts/build_addon.ps1
          cp dist/bento-forge.ankiaddon dist/bento-forge-smoke.zip
          unzip -t dist/bento-forge-smoke.zip
          mkdir -p clean-profile/addons21/bento-forge
          unzip -q dist/bento-forge-smoke.zip -d clean-profile/addons21/bento-forge
          BENTO_FORGE_DATA_DIR="$(mktemp -d)" python -m py_compile clean-profile/addons21/bento-forge/__init__.py clean-profile/addons21/bento-forge/utils/*.py clean-profile/addons21/bento-forge/ui/*.py clean-profile/addons21/bento-forge/workers/*.py clean-profile/addons21/bento-forge/mode/*.py clean-profile/addons21/bento-forge/audio/*.py clean-profile/addons21/bento-forge/hooks/*.py clean-profile/addons21/bento-forge/Language/*.py

      - name: Upload release evidence
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: bento-forge-package
          path: dist/

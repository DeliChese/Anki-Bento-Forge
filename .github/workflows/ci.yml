name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest ruff

      - name: Critical lint
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Run isolated tests
        run: |
          TEST_DATA_DIR="$(mktemp -d)"
          BENTO_FORGE_DATA_DIR="$TEST_DATA_DIR" python -m pytest --rootdir=tests --basetemp "$TEST_DATA_DIR/pytest" -p no:cacheprovider -q tests
          rm -rf "$TEST_DATA_DIR"

      - name: Compile check (syntax)
        run: python -m py_compile __init__.py utils/*.py ui/*.py workers/*.py mode/*.py audio/*.py hooks/*.py Language/*.py
